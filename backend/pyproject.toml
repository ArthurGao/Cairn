[project]
name = "cairn"
version = "0.1.0"
description = "File-driven agent harness for immigration advisers' case checks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "temporalio>=1.34",
    "pyyaml>=6.0.3",
    "filelock>=4.2.4",
    "rapidfuzz>=3.14.6",
    "python-ulid>=4.0.1",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
    "anthropic>=2.3.0",
    "openai>=3.37.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.2",
]

[project.scripts]
cairn = "cairn.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pillow>=13.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "reportlab>=5.1.0",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["cairn", "tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/cairn/core"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not live' -ra"
markers = ["live: calls a real LLM vendor; skips visibly without its key"]
