# Temporal dev server only. The worker, API and web run on the host (`make dev-worker`,
# `make dev-api`, `make dev-web`): they share the harness home and case store through file
# locks, which do not hold across the Docker Desktop file-sharing boundary.
name: cairn

services:
  temporal:
    image: temporalio/temporal:1.9.1  # same version as the `temporal` CLI used by `make dev-temporal`
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --port=7233
      - --ui-port=8233
      - --db-filename=/home/temporal/dev.db
    ports:  # loopback only: the dev server has no authentication
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      # Mounted on the image's home dir so the volume is owned by the non-root `temporal` user.
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  temporal-data:
