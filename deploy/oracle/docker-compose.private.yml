# Private mode (design §16.1, D-22): the owner alone reaches the demo, through an SSH tunnel to
# the VM's loopback; no port is open to the internet. Selected on the VM by
# COMPOSE_FILE=docker-compose.yml:docker-compose.llmgw.yml:docker-compose.private.yml in .env
# (.env.private.example).
services:
  caddy:
    ports: !override ["127.0.0.1:8080:80"]  # plain HTTP on loopback; the tunnel is the transport
